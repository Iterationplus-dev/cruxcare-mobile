ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    monnifySdkVersion = project.hasProperty('monnifySdkVersion') ? rootProject.ext.monnifySdkVersion : '1.1.8'
}

apply plugin: 'com.android.library'

android {
    namespace = "com.cruxcintl.monnify"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
        consumerProguardFiles 'proguard-rules.pro'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
    // Monnify's SDK resolves fine from Maven Central, but two of its transitive
    // dependencies (MasayukiSuda:BubbleLayout, NaikSoftware:StompProtocolAndroid)
    // are published only on JitPack. Without this the Gradle sync fails.
    maven { url = uri('https://jitpack.io') }
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "com.monnify.android-sdk:monnify-android-sdk:$monnifySdkVersion"
    testImplementation "junit:junit:$junitVersion"
}
